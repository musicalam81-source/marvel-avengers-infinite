<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | MARVEL AVENGERS: INFINITE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #f4f5ff;
      background: radial-gradient(circle at 75% 80%, #30104f, transparent 40%),
                  linear-gradient(135deg, #111d43, #050711 70%);
    }
    .panel {
      width: 100%;
      max-width: 440px;
      padding: 30px 24px;
      border: 1px solid #343d62;
      border-radius: 22px;
      background: rgba(17, 24, 48, .94);
    }
    h1 { text-align: center; font-size: 25px; }
    .sub { text-align: center; color: #aeb8d7; line-height: 1.8; }
    label { display: block; margin: 18px 0 8px; }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #424c70;
      background: #090e20;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      background: #818cff;
      color: #080b1a;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .secondary { background: #242d4b; color: white; }
    #message { margin-top: 16px; line-height: 1.7; text-align: center; }
    a { color: #b9c0ff; }
    .back { display: block; text-align: center; margin-top: 22px; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>🌌 MARVEL AVENGERS: INFINITE</h1>
    <p class="sub">أنشئ حسابك أو سجّل الدخول للانضمام إلى عالم القصص اللامتناهي.</p>

    <form id="authForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="name@example.com" required>

      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password"
             minlength="6" placeholder="6 أحرف على الأقل" required>

      <button type="submit" id="loginBtn">تسجيل الدخول</button>
      <button type="button" class="secondary" id="signupBtn">إنشاء حساب جديد</button>
    </form>

    <p id="message" role="status"></p>
    <a class="back" href="index.html">← العودة إلى الصفحة الرئيسية</a>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://tkwskjinrfbwwnwlyxjp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_6oBvR-50nHxk5uEEX8Rs6Q_h58lFGki';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const form = document.getElementById('authForm');
    const message = document.getElementById('message');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    async function handleAuth(mode) {
      if (!form.reportValidity()) return;

      message.textContent = 'جارٍ تنفيذ الطلب...';
      loginBtn.disabled = true;
      signupBtn.disabled = true;

      try {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        const result = mode === 'signup'
          ? await supabase.auth.signUp({
              email,
              password,
              options: {
                emailRedirectTo:
                  'https://musicalam81-source.github.io/marvel-avengers-infinite/'
              }
            })
          : await supabase.auth.signInWithPassword({ email, password });

        if (result.error) throw result.error;

        if (mode === 'signup' && !result.data.session) {
          message.textContent =
            'تم إنشاء الحساب! افحص بريدك الإلكتروني واضغط رابط التأكيد قبل تسجيل الدخول.';
        } else {
          message.textContent = 'تم تسجيل الدخول بنجاح! جارٍ نقلك...';
          window.location.href = 'index.html';
        }
      } catch (error) {
        message.textContent = 'تعذّر إتمام العملية: ' + error.message;
      } finally {
        loginBtn.disabled = false;
        signupBtn.disabled = false;
      }
    }

    loginBtn.addEventListener('click', event => {
      event.preventDefault();
      handleAuth('login');
    });

    signupBtn.addEventListener('click', () => handleAuth('signup'));
    form.addEventListener('submit', event => {
      event.preventDefault();
      handleAuth('login');
    });
  </script>
</body>
</html>
