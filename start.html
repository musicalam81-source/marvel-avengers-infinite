<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ابدأ قصتك | MARVEL AVENGERS : INFINITE</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 20%, #18285c, transparent 35%),
                radial-gradient(circle at 80% 80%, #35145c, transparent 35%),
                #050711;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        p {
            color: #aeb7d0;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .options {
            display: grid;
            gap: 15px;
        }

        .option {
            display: block;
            padding: 20px;
            background: #0b1020;
            border: 1px solid #252e49;
            border-radius: 16px;
            color: white;
            text-decoration: none;
            font-size: 19px;
            transition: 0.2s;
        }

        .option:hover {
            border-color: #6d7cff;
            transform: translateY(-2px);
            background: #11182d;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            color: #9ba6bd;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">🌌</div>

        <h1>ابدأ قصتك</h1>

        <p>
            مرحبًا بك في عالم
            <strong>MARVEL AVENGERS : INFINITE</strong>.
            <br>
            اختر كيف تريد الدخول إلى العالم.
        </p>

        <div class="options">

            <a class="option" href="#">
                🎭 اختيار شخصية
            </a>

            <a class="option" href="#">
                🧬 إنشاء شخصية أصلية
            </a>

            <a class="option" href="#">
                🌎 استكشاف عالم Marvel
            </a>

        </div>

        <a class="back" href="index.html">
            ← العودة إلى الصفحة الرئيسية
        </a>

    </main>

</body>
</html>
